<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>データの保存と送信 — YourStory</title><link rel="stylesheet" href="/login.css"><main><h1>データの保存と送信</h1><p>作品・チャットは起動したPCの .local/studio に保存されます。登録したAPIキーは暗号化して保存し、暗号鍵は .local/local-key-encryption に保存します。PCへアクセスできる人から秘密を守るものではありません。生成時はGoogleへ必要な文章・画像を送信します。音声認識はブラウザ提供元へ送られる場合があります。会社のAWS・メール・課金サービスへ接続しません。</p><p><a href="/app">YourStoryへ戻る</a></p></main></html>
