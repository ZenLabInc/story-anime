<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ログイン | YourStory</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/landing.css"><link rel="stylesheet" href="/login.css"></head><body><header class="nav"><a class="logo" href="/">Your<span>Story</span></a></header><main class="login-card"><p class="eyebrow">YOUR NEXT STORY</p><h1>あなたの漫画を、<br>ここから。</h1><p>ログインして、キャラと物語を育てましょう。</p><button id="google" class="cta" hidden>Googleでログイン</button><form id="email-form" hidden><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254"><button type="submit">認証コードを送信</button></form><form id="code-form" hidden><label for="code">メールに届いた6桁のコード</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit" class="cta">ログインする</button></form><p id="status" role="status" aria-live="polite">読み込み中…</p><p class="login-note">Googleとメールは別のログイン方法として保存されます。続きから制作するときは、前回と同じ方法をご利用ください。</p><p class="login-note">利用にあたり<a href="/terms">利用規約</a>と<a href="/privacy">プライバシーポリシー</a>をご確認ください。</p></main><script src="/login.js" defer></script></body></html>
